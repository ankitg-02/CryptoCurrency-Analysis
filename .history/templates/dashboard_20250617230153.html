<!DOCTYPE html>
<html>
  <head>
    <title>Dashboard - Crypto Price Prediction</title>
    <link
      rel="stylesheet"
      href="{{ url_for('static', filename='style.css') }}"
    />
    <script src="https://cdn.plot.ly/plotly-latest.min.js"></script>
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
  </head>
  <body>
    <div class="container">
      <nav class="navbar">
        <h1>Crypto Price Prediction Dashboard</h1>
        <div class="user-info">
          Welcome, {{ current_user.username }} | Predictions made: {{
          current_user.predictions }} |
          <a href="{{ url_for('main.logout') }}" class="button">Logout</a>
        </div>
      </nav>

      <div class="actions">
        <button class="button" onclick="trainModel()">Train New Model</button>
        <button class="button" onclick="getPredictions()">Get Predictions</button>
      </div>

      <div class="charts-grid">
        <div class="card">
          <h3>Price Prediction Chart</h3>
          <div id="price-chart" class="chart-container"></div>
        </div>
        <div class="card">
          <h3>Volatility Analysis</h3>
          <div id="volatility-chart" class="chart-container"></div>
        </div>
      </div>

      <div class="card">
        <h3>Recent Predictions</h3>
        <div id="predictions-table"></div>
      </div>
    </div>

    <script>
      function showLoading() {
        $("#loading").show();
        $(".actions button").prop("disabled", true);
      }

      function hideLoading() {
        $("#loading").hide();
        $(".actions button").prop("disabled", false);
      }

      function showError(message) {
        $("#error").text(message).show();
        setTimeout(() => $("#error").fadeOut(), 5000);
      }

      function showSuccess(message) {
        $("#success").text(message).show();
        setTimeout(() => $("#success").fadeOut(), 5000);
      }

      function trainModel() {
        showLoading();
        $.post("{{ url_for('main.train') }}")
          .done(function (response) {
            if (response.success) {
              showSuccess(
                "Model trained successfully with score: " + response.score
              );
              getPredictions();
            } else {
              showError("Training failed: " + response.error);
            }
          })
          .fail(function (xhr) {
            showError("Error training model: " + xhr.responseText);
          })
          .always(hideLoading);
      }

      function getPredictions() {
        $.post("{{ url_for('main.predict') }}")
          .done(function (response) {
            if (response.success) {
              plotCharts(response.predictions, response.summary);
              displayPredictionsTable(response.predictions);
              displaySummary(response.summary);
            } else {
              showError("Failed to get predictions: " + response.error);
            }
          })
          .fail(function (xhr) {
            showError("Error: " + xhr.responseText);
          });
      }

      function plotCharts(predictions, summary) {
        // Price Chart
        const priceData = [
          {
            x: predictions.map((p) => p.time),
            y: predictions.map((p) => p.actual_close),
            name: "Actual Price",
            type: "scatter",
            line: { color: "#2962ff" },
          },
          {
            x: predictions.map((p) => p.time),
            y: predictions.map((p) => p.predicted_close),
            name: "Predicted Price",
            type: "scatter",
            line: { color: "#00c853", dash: "dot" },
          },
        ];

        Plotly.newPlot("price-chart", priceData, {
          title: "Price Predictions vs Actual",
          height: 400,
          margin: { t: 30 },
        });

        // Volatility Chart
        const volatilityData = [
          {
            x: predictions.map((p) => p.time),
            y: predictions.map((p) => p.volatility),
            type: "scatter",
            fill: "tozeroy",
            name: "Volatility",
          },
        ];

        Plotly.newPlot("volatility-chart", volatilityData, {
          title: "Price Volatility",
          height: 400,
          margin: { t: 30 },
        });
      }

      function displayPredictionsTable(predictions) {
        const table = `
                <table>
                    <thead>
                        <tr>
                            <th>Date</th>
                            <th>Actual Price</th>
                            <th>Predicted Price</th>
                            <th>Difference</th>
                        </tr>
                    </thead>
                    <tbody>
                        ${predictions
                          .map(
                            (p) => `
                            <tr>
                                <td>${new Date(
                                  p.time
                                ).toLocaleDateString()}</td>
                                <td>$${p.actual_close.toFixed(2)}</td>
                                <td>$${p.predicted_close.toFixed(2)}</td>
                                <td>${(
                                  ((p.predicted_close - p.actual_close) /
                                    p.actual_close) *
                                  100
                                ).toFixed(2)}%</td>
                            </tr>
                        `
                          )
                          .join("")}
                    </tbody>
                </table>
            `;
        $("#predictions-table").html(table);
      }

      // Call getPredictions when page loads
      $(document).ready(function () {
        getPredictions();
      });
    </script>
  </body>
</html>
